version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: techmirai_db
    environment:
      POSTGRES_USER: techmirai
      POSTGRES_PASSWORD: techmirai123
      POSTGRES_DB: techmirai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - techmirai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techmirai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techmirai_backend
    environment:
      DATABASE_URL: postgresql://techmirai:techmirai123@db:5432/techmirai_db
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-info@techmirai-ai.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-info@techmirai-ai.com}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - techmirai_network
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Nginx (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: techmirai_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/usr/share/nginx/html
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - techmirai_network

volumes:
  postgres_data:

networks:
  techmirai_network:
    driver: bridge